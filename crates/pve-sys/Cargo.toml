[package]
name = "pve-sys"
description = "Real I/O for pve-bar: Proxmox and temperature agent HTTP clients, GNOME Keyring, config files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pve-core.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider"] }
futures-util = { version = "0.3", default-features = false }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json.workspace = true
tokio.workspace = true
webpki-roots = "1"
zbus.workspace = true

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true
