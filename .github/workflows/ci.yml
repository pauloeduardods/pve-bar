name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id is the required status check on main ("checks").
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglib2.0-bin dbus-daemon shellcheck

      - name: npm test
        run: npm test

      - name: npm run check
        run: npm run check

      - name: shellcheck
        run: shellcheck install.sh deploy/pve-temp-agent/install-agent.sh

      - name: Validate GSettings schema and unit files
        run: |
          glib-compile-schemas --strict --dry-run extension/schemas
          systemd-analyze security --offline=true deploy/pve-temp-agent/pve-temp-agent.service | tail -1

      - name: cargo fmt
        run: |
          rustup component add rustfmt
          cargo fmt --all --check

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo clippy
        run: |
          rustup component add clippy
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: pve-temp-agent builds as a static musl binary
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl -p pve-temp-agent
